<!-- TP4 -->
<h2>TP4: 🌐 Interactive 3D Scene (Vase & Balls)</h2>
<canvas id="webgl"></canvas>
<br>
<a href="Vase_and_Bricks.glb" download="Vase_and_Bricks.glb" class="download-btn">📂 Download GLB</a>
</section>

<script>
// Renderer & Canvas
const canvas = document.getElementById("webgl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, 600);
renderer.setPixelRatio(window.devicePixelRatio);

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeeee);

// Camera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/600, 0.1, 1000);
camera.position.set(3,2,4);

// Controls
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true;

// Lights
const hemiLight = new THREE.HemisphereLight(0xffffff,0x444444,1.2);
hemiLight.position.set(0,20,0);
scene.add(hemiLight);
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(5,10,7);
scene.add(dirLight);

// Physics world
const world = new CANNON.World();
world.gravity.set(0,-9.82,0);
world.broadphase = new CANNON.SAPBroadphase(world);
world.solver.iterations = 10;

// Ground plane
const groundBody = new CANNON.Body({ mass:0, shape: new CANNON.Plane() });
groundBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(groundBody);

// Load Vase GLB and setup physics
const loader = new THREE.GLTFLoader();
loader.load('Vase_and_Bricks.glb', gltf=>{
    const model = gltf.scene;
    scene.add(model);

    // Static vase body
    let vaseMesh = null;
    model.traverse(child=>{
        if(child.isMesh && child.name.toLowerCase().includes('vase')) vaseMesh = child;
    });

    if(vaseMesh){
        const bbox = new THREE.Box3().setFromObject(vaseMesh);
        const size = new THREE.Vector3();
        bbox.getSize(size);
        const boxShape = new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2));
        const vaseBody = new CANNON.Body({ mass:0 });
        vaseBody.addShape(boxShape);
        vaseBody.position.set((bbox.min.x+bbox.max.x)/2, (bbox.min.y+bbox.max.y)/2, (bbox.min.z+bbox.max.z)/2);
        world.addBody(vaseBody);
    }

    // Balls
    const balls = [];
    for(let i=0;i<5;i++){
        const radius = 0.1;
        const sphereGeo = new THREE.SphereGeometry(radius,32,32);
        const sphereMat = new THREE.MeshStandardMaterial({color:0xff0000});
        const sphereMesh = new THREE.Mesh(sphereGeo,sphereMat);
        sphereMesh.position.set(0,1 + i*0.25,0);
        scene.add(sphereMesh);

        const sphereShape = new CANNON.Sphere(radius);
        const sphereBody = new CANNON.Body({ mass:0.2 });
        sphereBody.addShape(sphereShape);
        sphereBody.position.set(0,1 + i*0.25,0);
        world.addBody(sphereBody);

        balls.push({mesh:sphereMesh, body:sphereBody});
    }

    // Animate loop
    function animate(){
        requestAnimationFrame(animate);
        world.step(1/60);
        balls.forEach(b=>{
            b.mesh.position.copy(b.body.position);
            b.mesh.quaternion.copy(b.body.quaternion);
        });
        controls.update();
        renderer.render(scene,camera);
    }
    animate();
});

// Resize
window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/600;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,600);
});
</script>
