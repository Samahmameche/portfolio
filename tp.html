    <h2>My TPs</h2>

    <!-- TP 1 Table + Chairs -->
    <div class="tp-3d-container">
      <h3>Tp2: 🪑 3D Table and Chairs</h3>

      <img src="table_chairs.png" alt="Table et chaises" width="800" height="600">

    </a>



    <!-- ⭐ TP 3 Interactive Scene (GLB) -->
    <h2>TP4: 🌐 Interactive 3D Scene (Vase & Balls)</h2>

    <model-viewer 
      src="Vase and Bricks.glb"
      alt="Interactive Vase Simulation"
      auto-rotate
      camera-controls
      interaction-prompt="when-focused"
      style="width: 100%; max-width: 900px; height: 600px; margin: auto; border-radius: 12px; background: #eee;">
    </model-viewer>

    <br>

    <a href="scene.glb" download="scene.glb" class="download-btn">
