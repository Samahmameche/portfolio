  <!-- ⭐ TP 3 Interactive Scene avec Physics -->
  <h2>TP4: 🌐 Interactive 3D Scene (Vase & Balls)</h2>

  <canvas id="webgl" style="width:100%; height:600px; display:block; margin:auto;"></canvas>

  <br>
  <a href="scene.glb" download="scene.glb" class="download-btn">
    📂 Download GLB
  </a>

</section>

<script>
(async function() {
  const canvas = document.getElementById('webgl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeeeeee);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(3, 2, 4);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Lights
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
  hemi.position.set(0, 20, 0);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(5,10,5);
  dir.castShadow = true;
  scene.add(dir);

  // Physics world
  const world = new CANNON.World();
  world.gravity.set(0,-9.82,0);
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.solver.iterations = 10;

  // ground plane
  const groundBody = new CANNON.Body({ mass:0, shape: new CANNON.Plane() });
  groundBody.quaternion.setFromEuler(-Math.PI/2,0,0);
  world.addBody(groundBody);

  // Load GLB
  const loader = new THREE.GLTFLoader();
  loader.load('scene.glb', gltf => {
    const model = gltf.scene;
    scene.add(model);

    const balls = [];
    let vaseMesh = null;

    model.traverse(child => {
      if(child.isMesh){
        child.castShadow = true;
        child.receiveShadow = true;
        const name = (child.name||'').toLowerCase();
        if(name.includes('ball') || name.includes('sphere')) balls.push(child);
        else if(name.includes('vase') || name.includes('container')) vaseMesh = child;
      }
    });

    // vase static body
    if(vaseMesh){
      const bbox = new THREE.Box3().setFromObject(vaseMesh);
      const size = new THREE.Vector3();
      bbox.getSize(size);
      const boxShape = new CANNON.Box(new CANNON.Vec3(size.x/2, size.y/2, size.z/2));
      const body = new CANNON.Body({ mass:0 });
      body.addShape(boxShape);
      body.position.set((bbox.min.x+bbox.max.x)/2, (bbox.min.y+bbox.max.y)/2, (bbox.min.z+bbox.max.z)/2);
      world.addBody(body);
    }

    // balls physics
    const pairs = [];
    balls.forEach(mesh=>{
      const worldPos = new THREE.Vector3();
      mesh.getWorldPosition(worldPos);
      mesh.geometry.computeBoundingSphere();
      const radius = mesh.geometry.boundingSphere.radius * mesh.scale.x;
      const shape = new CANNON.Sphere(radius);
      const body = new CANNON.Body({ mass:0.2 });
      body.addShape(shape);
      body.position.set(worldPos.x, worldPos.y, worldPos.z);
      world.addBody(body);
      scene.attach(mesh);
      pairs.push({mesh,body});
    });

    // UI
    createUI(pairs, world);

    // animation loop
    const fixedStep = 1/60;
    let lastTime;
    function animate(){
      requestAnimationFrame(animate);
      const time = performance.now()/1000;
      if(lastTime!==undefined){
        const dt = time-lastTime;
        world.step(fixedStep, dt,3);
      }
      lastTime=time;

      pairs.forEach(p=>{
        p.mesh.position.copy(p.body.position);
        p.mesh.quaternion.copy(p.body.quaternion);
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

  });

  window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function createUI(pairs,world){
    const container = document.createElement('div');
    container.style.position='fixed';
    container.style.right='20px';
    container.style.top='80px';
    container.style.background='rgba(255,255,255,0.9)';
    container.style.padding='10px';
    container.style.borderRadius='8px';
    container.style.fontFamily='sans-serif';
    container.style.zIndex=9999;

    const restartBtn = document.createElement('button');
    restartBtn.textContent='Restart Simulation';
    restartBtn.onclick=()=>{
      pairs.forEach(p=>{
        p.body.position.set(p.mesh.position.x,p.mesh.position.y+1,p.mesh.position.z);
        p.body.velocity.set(0,0,0);
        p.body.angularVelocity.set(0,0,0);
      });
    };
    container.appendChild(restartBtn);

    container.appendChild(document.createElement('br'));

    const gravLabel = document.createElement('label');
    gravLabel.textContent='Gravity: ';
    container.appendChild(gravLabel);

    const gravInput = document.createElement('input');
    gravInput.type='range';
    gravInput.min=-20;
    gravInput.max=0;
    gravInput.value=-9.82;
    gravInput.style.width='120px';
    gravInput.oninput=(e)=>{
      const g = parseFloat(e.target.value);
      world.gravity.set(0,g,0);
    };
    container.appendChild(gravInput);

    document.body.appendChild(container);
  }

})();
</script>
